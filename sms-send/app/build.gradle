plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.example.smssend'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.example.smssend'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external app libraries are used to keep the project light for Termux/GitHub workflows.
}
